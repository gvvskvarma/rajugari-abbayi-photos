name = "photography-api"
main = "src/index.ts"
compatibility_date = "2026-03-08"
workers_dev = true
preview_urls = false

[observability]
enabled = true

# Workers Paid plan: raise CPU to 30s so large multi-GB zip downloads
# (CRC32 + copy over every byte ≈ 10-15s for 5.67GB) aren't killed
# mid-stream. Only active CPU counts — I/O wait while streaming to the
# client does not. The pull-based zip stream also keeps memory bounded.
[limits]
cpu_ms = 30000

[[r2_buckets]]
binding = "R2_MEDIA_BUCKET"
bucket_name = "photography-private"

[vars]
APP_ORIGIN = "https://rajugariabbayishots.vercel.app"
SUPABASE_URL = "https://ogcafgdhchzheennyzva.supabase.co"
# SUPABASE_ANON_KEY is publishable (role=anon, RLS-gated). Committed for clarity —
# for best-practice separation, consider moving to `wrangler secret put SUPABASE_ANON_KEY`.
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nY2FmZ2RoY2h6aGVlbm55enZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MjM2MjUsImV4cCI6MjA4ODQ5OTYyNX0.KIzrmyFJcFIf5UlLs-1CZmADULdh3bKEamdrEdglYaw"
R2_ACCOUNT_ID = "3bb24180dda29410cb330891f7c62322"
R2_BUCKET = "photography-private"
# From-address for client-notification emails. Domain (rga-photography.com)
# is verified in Resend. The local-part (hello@) is arbitrary — Resend
# accepts any address on a verified domain. Override locally via .dev.vars.
EMAIL_FROM = "Rajugari Abbayi Photography <hello@rga-photography.com>"
# Retention lifecycle dry-run. "true" = the daily cron LOGS what it would
# warn/soft-delete/purge but performs nothing. Flip to "false" only after
# verifying a week of dry-run logs look correct.
LIFECYCLE_DRY_RUN = "true"

# Daily retention lifecycle cron (09:12 UTC — offset to avoid the on-the-hour
# rush). Warns 3 days before expiry, soft-deletes at the 45-day cutoff, purges
# R2 + rows 3 days after that.
[triggers]
crons = ["12 9 * * *"]

# Set secrets with:
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# wrangler secret put TOKEN_SIGNING_SECRET   # random 32+ bytes (optional — falls back to SRK)
# wrangler secret put R2_ACCESS_KEY_ID
# wrangler secret put R2_SECRET_ACCESS_KEY
# wrangler secret put SENTRY_DSN             # optional — error tracking
# wrangler secret put RESEND_API_KEY         # required to send client emails
