name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (frontend)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck (worker)
        working-directory: worker
        run: |
          npm ci
          npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
