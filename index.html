<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/logo-200.png" />
    <link rel="apple-touch-icon" href="/logo/logo-200.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d0f15" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://photography-api.gvvskvarma-account.workers.dev" crossorigin />
    <!-- Preload the locally-hosted Twigs font so it's available before the
         hero h1 renders. Combined with `font-display: optional` in
         index.css, this eliminates the layout shift the hero would
         otherwise have when the font arrives mid-render. -->
    <link
      rel="preload"
      as="font"
      type="font/otf"
      href="/fonts/Twigs.otf"
      crossorigin
    />
    <!-- Preload the LCP hero image. We know which image will be picked because
         the homepage hero defaults to the first event-gallery asset, served
         via the worker's public-media route. `imagesrcset` lets the browser
         pick the right size for the viewport just like the runtime <img> does.
         Per Lighthouse, this saves ~1.8s on LCP. -->
    <link
      rel="preload"
      as="image"
      href="https://photography-api.gvvskvarma-account.workers.dev/api/v1/public-media/project-rga/optimized/potraits/events/RGA03248-2-1200.jpg"
      imagesrcset="https://photography-api.gvvskvarma-account.workers.dev/api/v1/public-media/project-rga/optimized/potraits/events/RGA03248-2-640.jpg 640w, https://photography-api.gvvskvarma-account.workers.dev/api/v1/public-media/project-rga/optimized/potraits/events/RGA03248-2-1200.jpg 1200w, https://photography-api.gvvskvarma-account.workers.dev/api/v1/public-media/project-rga/optimized/potraits/events/RGA03248-2-1800.jpg 1800w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    />
    <!-- Non-blocking Google Fonts: `media="print"` makes the browser download
         the CSS without applying it to screen, so it doesn't block render.
         A tiny script in main.tsx flips `media` to `all` once the bundle runs,
         which applies the fonts. This approach is CSP-safe (no inline event
         handler — our `script-src 'self'` allows the bundled script). -->
    <link
      rel="stylesheet"
      data-deferred-style
      media="print"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      />
    </noscript>
    <title>Rajugari Abbayi Photography</title>
    <meta
      name="description"
      content="Rajugari Abbayi Photography portfolio by Vishnu Varma. Landscapes, portraits, events, and booking."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rajugari Abbayi Photography" />
    <meta
      property="og:description"
      content="Landscapes, portraits, events, and booking by Vishnu Varma."
    />
    <meta
      property="og:image"
      content="https://rajugariabbayishots.vercel.app/social/cover.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rajugari Abbayi Photography" />
    <meta
      name="twitter:description"
      content="Landscapes, portraits, events, and booking by Vishnu Varma."
    />
    <meta
      name="twitter:image"
      content="https://rajugariabbayishots.vercel.app/social/cover.jpg"
    />
    <link rel="canonical" href="https://rajugariabbayishots.vercel.app/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Rajugari Abbayi Photography",
      "description": "Photography portfolio by Vishnu Varma. Landscapes, portraits, events, and booking.",
      "url": "https://rajugariabbayishots.vercel.app",
      "image": "https://rajugariabbayishots.vercel.app/social/cover.jpg",
      "priceRange": "$$",
      "address": { "@type": "PostalAddress", "addressCountry": "US" },
      "sameAs": [
        "https://www.instagram.com/rajugari_abbayi_photography"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>Rajugari Abbayi Photography requires JavaScript to display the portfolio. Please enable JavaScript in your browser.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
